<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="50%" stop-color="#007AFF" />
      <stop offset="100%" stop-color="#0051D5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34C759" />
      <stop offset="100%" stop-color="#30D158" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#002D80" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- iOS App Icon Squircle Background -->
  <rect width="512" height="512" rx="114" fill="url(#bgGrad)" />

  <!-- Subtle Inner Specular Highlight -->
  <rect x="2" y="2" width="508" height="508" rx="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3" />

  <!-- Central Debty Ledger Mark -->
  <g filter="url(#softShadow)" transform="translate(256, 256)">
    <!-- Top Green Incoming Arrow / Arch -->
    <path d="M -110,-40 C -110,-100 -50,-140 30,-140 C 90,-140 130,-110 145,-75" 
          fill="none" stroke="#34C759" stroke-width="32" stroke-linecap="round" />
    <polygon points="120,-85 160,-65 165,-110" fill="#34C759" />

    <!-- Bottom Coral-Red / Orange Outgoing Arrow / Arch -->
    <path d="M 110,40 C 110,100 50,140 -30,140 C -90,140 -130,110 -145,75" 
          fill="none" stroke="#FF453A" stroke-width="32" stroke-linecap="round" />
    <polygon points="-120,85 -160,65 -165,110" fill="#FF453A" />

    <!-- Sleek Central Currency Token Card -->
    <circle cx="0" cy="0" r="48" fill="#FFFFFF" />
    <!-- Minimalist Balanced Scale / D Symbol inside circle -->
    <path d="M -14,-22 L 4,-22 C 18,-22 26,-12 26,0 C 26,12 18,22 4,22 L -14,22 Z" 
          fill="none" stroke="#007AFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="-14" y1="-22" x2="-14" y2="22" stroke="#007AFF" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
